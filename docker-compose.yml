services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: ./config/.env
    environment:
      POSTGRES_DB: ${DB_NAME:-iciitp}
      POSTGRES_USER: ${DB_USER:-iciitp}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-iciitp}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: ./config/.env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      UPLOAD_DIR: /app/data/uploads
    volumes:
      - ./data/uploads:/app/data/uploads
    expose:
      - "8080"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    env_file: ./config/.env
    environment:
      NODE_ENV: production
      API_URL: http://backend:8080/api/v1
    expose:
      - "3000"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/uploads:/data/uploads:ro
      - ./data/ssl:/etc/nginx/ssl:ro
